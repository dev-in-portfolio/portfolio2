name: Apply Canonical Route Migration

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/fix-legacy-navigation-paths.mjs'
      - '.github/workflows/apply-canonical-route-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rewrite legacy standalone routes
        run: node scripts/fix-legacy-navigation-paths.mjs

      - name: Commit migrated navigation sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No legacy navigation routes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home apps about contact utilities capabilities
          git commit -m "fix(navigation): migrate legacy standalone routes"
          git push origin HEAD:main
