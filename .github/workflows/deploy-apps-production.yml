name: Deploy Apps Production

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-apps-production.yml'
      - 'apps/**'
      - 'data/apps.registry.json'
      - 'data/build-targets.registry.json'
      - 'data/static-targets.registry.json'
      - 'data/deployments.registry.json'
      - 'package.json'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: deploy-apps-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build, verify, and deploy Apps site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NETLIFY_SITE_ID: 3a07e73d-1992-4f9c-adba-dab82f41e168
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
      SITE_NAME: dev-in-portfolio-apps

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deployment credential
        id: credential
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "### Apps production deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`NETLIFY_AUTH_TOKEN\` or \`NETLIFY_TOKEN\` repository secret is configured." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build standalone Apps production package
        run: npm run build:apps-deployment

      - name: Verify Apps production package
        shell: bash
        run: |
          test -f apps/dist/index.html
          test -f apps/dist/apps/index.html
          test -f apps/dist/nexus-apps-deployment-manifest.json
          node scripts/validate-assembled-site.mjs --output apps/dist

      - name: Deploy validated Apps package to production
        shell: bash
        run: |
          npx -y netlify-cli@latest deploy \
            --prod \
            --dir=apps/dist \
            --functions=apps/netlify/functions \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Apps production ${GITHUB_SHA}"
