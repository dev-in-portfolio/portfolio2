name: Materialize Current Solo Apps

on:
  push:
    branches: [main]
    paths: ['.github/workflows/materialize-current-solo-apps.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/.solo-app-materialize-trigger']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-current-solo-apps
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated standalone artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-df08-722f-94f9-258609b9b05b/raw?se=2026-07-11T01:43:02Z&sp=r&sv=2026-02-06&sr=b&scid=f518c950-dc51-5624-8d32-da9d902cf4d9&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-10T02:02:44Z&ske=2026-07-12T02:02:44Z&sks=b&skv=2026-02-06&sig=VqcZSbbrS2Cvhb28AeSey5tFQTdUiaJtgjvz5Vwg0cM%3D' --output /tmp/alibi.zip
          curl --fail --location --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-f830-722f-8442-e6e11c2865c1/raw?se=2026-07-11T01:43:10Z&sp=r&sv=2026-02-06&sr=b&scid=c8da5bc9-d5bc-5f29-b34b-0d2304e0046f&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-10T06:29:52Z&ske=2026-07-12T06:29:52Z&sks=b&skv=2026-02-06&sig=Kzp0CL6acBO5ts2RZKG5uSpfCrugQ5kdqofCtydzfJ0%3D' --output /tmp/coverage.zip
          echo '9cfe80bfdc8c019561ea2b2eae1698b841c57cc836bdc7df707cfb0eb61c524a  /tmp/alibi.zip' | sha256sum --check --strict
          echo '069f0baeb47725de5aed78a5800f41d60353398ccd5ac667d7ca0c8f833c3d2f  /tmp/coverage.zip' | sha256sum --check --strict

      - name: Replace embedded applications
        run: |
          rm -rf apps/apps/alibi apps/apps/coverage-compass
          mkdir -p apps/apps/alibi apps/apps/coverage-compass
          unzip -q /tmp/alibi.zip -d apps/apps/alibi
          unzip -q /tmp/coverage.zip -d apps/apps/coverage-compass

      - name: Apply portfolio contract and provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          apps = {
            'alibi': {
              'canonical': 'https://dev-in-portfolio.netlify.app/apps/alibi/',
              'source': 'dev-in-portfolio/Alibi',
              'commit': '67955554de6c98763914755e07c863955f61c92e',
              'artifact': 'alibi-netlify-site',
              'artifact_sha256': '9cfe80bfdc8c019561ea2b2eae1698b841c57cc836bdc7df707cfb0eb61c524a'
            },
            'coverage-compass': {
              'canonical': 'https://dev-in-portfolio.netlify.app/apps/coverage-compass/',
              'source': 'dev-in-portfolio/Coverage-Compass',
              'commit': 'f5c2f37209966465de016257cb5dfa92d6251c1c',
              'artifact': 'coverage-compass-dist',
              'artifact_sha256': '069f0baeb47725de5aed78a5800f41d60353398ccd5ac667d7ca0c8f833c3d2f'
            }
          }
          def add_once(text, marker, insertion, before):
            return text if marker in text else text.replace(before, f'{insertion}\n{before}', 1)
          for slug, meta in apps.items():
            directory = Path('apps/apps') / slug
            page = directory / 'index.html'
            html = page.read_text(encoding='utf-8')
            head = (
              '  <link rel="stylesheet" href="/shared/tokens.css">\n'
              '  <link rel="stylesheet" href="/shared/nexus-topnav-v2.css?v=55">\n'
              f'  <link rel="canonical" href="{meta["canonical"]}">\n'
              f'  <script>window.APP_ID={json.dumps(slug)};</script>'
            )
            html = add_once(html, '/shared/nexus-topnav-v2.css', head, '</head>')
            if 'class="nxTopNav"' not in html:
              body_at = html.find('<body')
              body_end = html.find('>', body_at) + 1
              html = html[:body_end] + '\n  <nav class="nxTopNav" aria-label="Nexus navigation"></nav>' + html[body_end:]
            scripts = '  <script defer src="/shared/nexus-topnav-v2.js?v=55"></script>\n  <script defer src="/shared/nexus-canonical-routes.js?v=1"></script>'
            html = add_once(html, '/shared/nexus-topnav-v2.js', scripts, '</body>')
            page.write_text(html, encoding='utf-8')
            provenance = {
              'sourceRepository': meta['source'], 'sourceCommit': meta['commit'],
              'sourceArtifact': meta['artifact'], 'sourceArtifactSha256': meta['artifact_sha256'],
              'portfolioRoute': f'/apps/{slug}/'
            }
            (directory / '.portfolio-source.json').write_text(json.dumps(provenance, indent=2) + '\n', encoding='utf-8')
          page404 = Path('apps/apps/coverage-compass/404.html')
          page404.write_text(page404.read_text(encoding='utf-8').replace('https://coverage-compass.app/', apps['coverage-compass']['canonical']), encoding='utf-8')
          registry_path = Path('data/apps.registry.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          for app in registry['applications']:
            if app['id'] in {'alibi', 'coverage-compass'}:
              app.pop('reforgeScope', None)
              app.pop('deferReason', None)
              app['lifecycleStatus'] = 'pending-review'
              app['verification'] = {'status': 'pending'}
          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          manifest = {'schemaVersion': 1, 'applications': {}}
          for slug, meta in apps.items():
            directory = Path('apps/apps') / slug
            files=[]
            for file in sorted(p for p in directory.rglob('*') if p.is_file()):
              payload=file.read_bytes()
              files.append({'path':file.relative_to(directory).as_posix(),'bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest()})
            manifest['applications'][slug]={**meta,'files':files}
          Path('reports/reforge').mkdir(parents=True,exist_ok=True)
          Path('reports/reforge/solo-app-swap.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate registries
        run: npm run validate:registries
      - name: Validate static target registry
        run: npm run validate:static-targets
      - name: Inventory static dependencies
        run: npm run inventory:static:report
      - name: Verify protected files
        run: npm run verify:protected
      - name: Verify imported release markers
        run: |
          test -f apps/apps/alibi/src/runtime-hardening.js
          test -f apps/apps/coverage-compass/src/browser/runtime.js
          grep -q '2.0.0-modular.1' apps/apps/coverage-compass/build-metadata.json

      - name: Remove temporary transfer files
        run: |
          rm -f tmp/solo-deploy-bridge.html scripts/.solo-app-materialize-trigger
          rm -f .github/workflows/materialize-current-solo-apps.yml

      - name: Commit exact standalone swaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apps/apps/alibi apps/apps/coverage-compass data/apps.registry.json reports/reforge/solo-app-swap.json tmp/solo-deploy-bridge.html scripts/.solo-app-materialize-trigger .github/workflows/materialize-current-solo-apps.yml
          git commit -m 'feat(apps): replace Alibi and Coverage Compass from standalone releases'
          git push origin HEAD:main
