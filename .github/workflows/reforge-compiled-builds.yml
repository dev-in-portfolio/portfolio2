name: NEXUS Production Build Verification

on:
  push:
    branches:
      - main
      - 'reforge/**'
    paths:
      - 'index.html'
      - 'home/**'
      - 'apps/**'
      - 'utilities/**'
      - 'about/**'
      - 'contact/**'
      - 'capabilities/**'
      - 'config/netlify/**'
      - 'netlify.toml'
      - 'data/apps.registry.json'
      - 'data/build-targets.registry.json'
      - 'data/build-verification.registry.json'
      - 'data/static-targets.registry.json'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/reforge-compiled-builds.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'home/**'
      - 'apps/**'
      - 'utilities/**'
      - 'about/**'
      - 'contact/**'
      - 'capabilities/**'
      - 'config/netlify/**'
      - 'netlify.toml'
      - 'data/apps.registry.json'
      - 'data/build-targets.registry.json'
      - 'data/build-verification.registry.json'
      - 'data/static-targets.registry.json'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/reforge-compiled-builds.yml'

concurrency:
  group: nexus-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: helios
            source: apps/apps/helios
            route: /apps/helios/
          - id: transit
            source: apps/apps/transit
            route: /apps/transit/
          - id: vortex
            source: apps/apps/vortex
            route: /apps/vortex/
          - id: helix
            source: apps/apps/helix
            route: /apps/helix/
          - id: tectonic
            source: apps/apps/tectonic
            route: /apps/tectonic/
          - id: aeon
            source: apps/apps/aeon
            route: /apps/aeon/
          - id: magma
            source: apps/apps/magma
            route: /apps/magma/
          - id: string
            source: apps/apps/string
            route: /apps/string/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install application dependencies
        working-directory: ${{ matrix.source }}
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Build application
        working-directory: ${{ matrix.source }}
        run: npm run build

      - name: Verify compiled output
        run: >-
          node scripts/verify-built-target.mjs
          --id "${{ matrix.id }}"
          --source "${{ matrix.source }}"
          --route "${{ matrix.route }}"

      - name: Upload compiled application and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-${{ matrix.id }}
          path: |
            ${{ matrix.source }}/dist
            reports/reforge/builds/${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 14

  assemble-production:
    name: Build exact main Netlify package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download all compiled applications
        uses: actions/download-artifact@v4
        with:
          pattern: compiled-*
          path: .
          merge-multiple: true

      - name: Build exact production package and generated functions
        env:
          SITE_NAME: dev-in-portfolio
        run: npm run build:netlify:cached

      - name: Verify generated Vortex function exists
        run: test -f netlify/functions/vortex-market.js

      - name: Upload exact production site
        uses: actions/upload-artifact@v4
        with:
          name: nexus-production-site
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated production functions
        uses: actions/upload-artifact@v4
        with:
          name: nexus-production-functions
          path: netlify/functions
          if-no-files-found: error
          retention-days: 14

  browser-audit:
    name: Audit exact production package in Chromium
    needs: assemble-production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download exact production package
        uses: actions/download-artifact@v4
        with:
          name: nexus-production-site
          path: dist

      - name: Install current Playwright bootstrap
        shell: bash
        run: |
          PLAYWRIGHT_VERSION="$(npm view playwright version)"
          echo "PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION}" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Start exact production preview server
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/nexus-production-preview.log 2>&1 &
          echo $! > /tmp/nexus-production-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:4173/apps/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:4173/tools/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:4173/about/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:4173/contact/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:4173/capabilities/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexus-production-preview.log
          exit 1

      - name: Audit all canonical production routes
        run: node scripts/browser-audit-production.mjs --base-url http://127.0.0.1:4173 --output reports/reforge/production-browser

      - name: Record browser toolchain
        if: always()
        shell: bash
        run: |
          mkdir -p reports/reforge/production-browser
          printf '{\n  "node": "%s",\n  "playwright": "%s"\n}\n' "$(node --version)" "${PLAYWRIGHT_VERSION:-unknown}" > reports/reforge/production-browser/toolchain.json

      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-production-browser-audit
          path: reports/reforge/production-browser
          if-no-files-found: warn
          retention-days: 14
