name: Reforge Foundation Baseline

on:
  push:
    branches:
      - 'reforge/**'
  pull_request:
    paths:
      - 'package.json'
      - 'data/**'
      - 'scripts/**'
      - 'apps/assets/apps-data.json'
      - 'home/**'
      - 'apps/**'
      - 'utilities/**'
      - 'about/**'
      - 'contact/**'
      - 'capabilities/**'
      - '.github/workflows/reforge-foundation-baseline.yml'

permissions:
  contents: read

jobs:
  baseline:
    name: Validate baseline and protected files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compare canonical registry with legacy catalog
        run: npm run inventory

      - name: Inventory copied roots and shared-file divergence
        run: npm run inventory:roots:report

      - name: Inventory deployment roots and duplicated functions
        run: npm run inventory:deployments:report

      - name: Inventory compiled application build readiness
        run: npm run inventory:builds:report

      - name: Validate canonical registry structure
        run: npm run validate:registries

      - name: Cross-validate compiled build targets
        run: npm run validate:build-targets

      - name: Verify protected files are unchanged
        run: npm run verify:protected

      - name: Upload foundation inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: reforge-foundation-inventory
          path: reports/reforge/*.json
          if-no-files-found: error
          retention-days: 30
