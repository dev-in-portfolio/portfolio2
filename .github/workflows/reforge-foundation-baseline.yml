name: Reforge Foundation Baseline

on:
  push:
    branches:
      - 'reforge/**'
  pull_request:
    paths:
      - 'package.json'
      - 'data/**'
      - 'scripts/**'
      - 'apps/assets/apps-data.json'
      - 'capabilities/**'
      - '.github/workflows/reforge-foundation-baseline.yml'

permissions:
  contents: read

jobs:
  baseline:
    name: Validate baseline and protected files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compare canonical registry with legacy catalog
        run: npm run inventory

      - name: Validate canonical registry structure
        run: npm run validate:registries

      - name: Verify protected files are unchanged
        run: npm run verify:protected
