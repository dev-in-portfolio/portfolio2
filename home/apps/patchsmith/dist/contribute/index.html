<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contribute</title><meta name="description" content="Translate restaurant ops language to tech/product equivalents."><link rel="stylesheet" href="/styles/global.css"></head> <body> <header class="site-header"> <div class="station-label">Station: Terms Translator</div> <div class="station-sub">Kitchen ↔ Tech</div> <nav class="station-nav"> <a class="nav-link" href="/">Translator</a> <a class="nav-link" href="/terms">Full List</a> <a class="nav-link" href="/categories">Categories</a> <a class="nav-link" href="/favorites">Favorites</a> <a class="nav-link" href="/contribute">Contribute</a> </nav> </header> <main class="main">  <section class="panel"> <div class="panel-strip">Contribute</div> <h1 class="page-title">Contribute a Term</h1> <p class="muted">Add a custom term. If the backend is unavailable, it is stored locally and marked as local-only.</p> <form class="form-grid" data-contribute-form> <label class="field">

<input type="text" name="slug" required> </label> <label class="field">

Tech Definition
<textarea name="definitionTech" required></textarea> </label> <label class="field">
Restaurant Examples (comma separated)
<input type="text" name="examplesRestaurant" required> </label> <label class="field">
Tech Examples (comma separated)
<input type="text" name="examplesTech" required> </label> <label class="field">
Tags (comma separated)
<input type="text" name="tags"> </label> <label class="field">
Related Slugs (comma separated)
<input type="text" name="related"> </label> <div class="controls"> <button type="submit" class="btn-primary">Fire</button> <button type="reset" class="btn-ghost">86</button> </div> </form> <div class="status-line" data-contribute-status hidden></div> </section>  </main> <script type="module" src="/scripts/app.js"></script> </body> </html>
