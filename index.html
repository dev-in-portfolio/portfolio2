<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Home</title>
<link href="/home/shared/tokens.css" rel="stylesheet"/>
<link href="/home/shared/nexus-topnav-v2.css?v=54" rel="stylesheet"/>
<script src="/home/runtime-guard.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #07060a;
    overflow: hidden;
    height: 100vh;
    font-family: system-ui, sans-serif;
    color: #fff;
  }
  
  /* Keep navbar on top */
  nav.nxTopNav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9000;
  }

  canvas#c {
    display: block;
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .label {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.15);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
    font-family: monospace;
  }
</style>
</head>
<body>
<nav class="nxTopNav"></nav>

<canvas id="c"></canvas>
<div class="label">3D Engine · move mouse to orbit</div>

<script src="/home/shared/nexus-topnav-v2.js?v=54" defer></script>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  let rotX = 0.4, rotY = 0.6;
  let targetRX = 0.4, targetRY = 0.6;

  // Listen to window mousemove for full-screen response
  window.addEventListener('mousemove', e => {
    targetRY = (e.clientX / W - 0.5) * Math.PI * 2;
    targetRX = (e.clientY / H - 0.5) * Math.PI;
  });

  function project(x, y, z) {
    const cz = Math.cos(rotX), sz = Math.sin(rotX);
    const cy = Math.cos(rotY), sy = Math.sin(rotY);
    let x1 = x;
    let y1 = y * cz - z * sz;
    let z1 = y * sz + z * cz;
    let x2 = x1 * cy + z1 * sy;
    let y2 = y1;
    let z2 = -x1 * sy + z1 * cy;
    const fov = 600;
    const scale = fov / (fov + z2);
    return { sx: W / 2 + x2 * scale, sy: H / 2 + y2 * scale, scale, z: z2 };
  }

  const particles = [];

  function addCube(size, hue, cx, cy, cz, count) {
    const h = size / 2;
    for (let i = 0; i < count; i++) {
      const face = Math.floor(Math.random() * 6);
      let x, y, z;
      switch (face) {
        case 0: x = -h; y = (Math.random() - 0.5) * size; z = (Math.random() - 0.5) * size; break;
        case 1: x = h; y = (Math.random() - 0.5) * size; z = (Math.random() - 0.5) * size; break;
        case 2: y = -h; x = (Math.random() - 0.5) * size; z = (Math.random() - 0.5) * size; break;
        case 3: y = h; x = (Math.random() - 0.5) * size; z = (Math.random() - 0.5) * size; break;
        case 4: z = -h; x = (Math.random() - 0.5) * size; y = (Math.random() - 0.5) * size; break;
        case 5: z = h; x = (Math.random() - 0.5) * size; y = (Math.random() - 0.5) * size; break;
      }
      particles.push({ x: cx + x, y: cy + y, z: cz + z, hue: hue + Math.random() * 25, size: 2 + Math.random() * 3 });
    }
  }

  function addSphere(radius, hue, cx, cy, cz, count) {
    for (let i = 0; i < count; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = radius;
      particles.push({
        x: cx + r * Math.sin(phi) * Math.cos(theta),
        y: cy + r * Math.sin(phi) * Math.sin(theta),
        z: cz + r * Math.cos(phi),
        hue: hue + Math.random() * 30,
        size: 1.5 + Math.random() * 3,
      });
    }
  }

  function addTorus(radius, tube, hue, cx, cy, cz, count) {
    for (let i = 0; i < count; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI * 2;
      particles.push({
        x: cx + (radius + tube * Math.cos(phi)) * Math.cos(theta),
        y: cy + tube * Math.sin(phi),
        z: cz + (radius + tube * Math.cos(phi)) * Math.sin(theta),
        hue: hue + theta * 25 + Math.random() * 20,
        size: 1.5 + Math.random() * 2.5,
      });
    }
  }

  addCube(130, 200, -160, -40, 0, 500);
  addSphere(90, 300, 160, -30, 0, 500);
  addTorus(80, 30, 40, 0, 90, 0, 500);

  for (let i = 0; i < 200; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 60 + Math.random() * 40;
    particles.push({
      x: Math.cos(angle) * r,
      y: -120 + Math.random() * 20,
      z: Math.sin(angle) * r,
      hue: 260 + Math.random() * 30,
      size: 1.5 + Math.random() * 2,
    });
  }

  function animate() {
    rotX += (targetRX - rotX) * 0.06;
    rotY += (targetRY - rotY) * 0.06;

    ctx.fillStyle = 'rgba(7, 6, 10, 0.1)';
    ctx.fillRect(0, 0, W, H);

    const projected = particles
      .map(p => {
        const { sx, sy, scale, z } = project(p.x, p.y, p.z);
        return { ...p, sx, sy, scale, z };
      })
      .filter(p => p.scale > 0.05)
      .sort((a, b) => b.z - a.z);

    for (const p of projected) {
      const sz = p.size * p.scale;
      if (sz < 0.5) continue;
      const alpha = Math.min(0.8, p.scale * 0.7);
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, sz, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue + p.scale * 20}, 80%, ${45 + p.scale * 25}%, ${alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
