<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Utilities — Systems Documentation Hub</title>
  <link href="../shared/tokens.css" rel="stylesheet"/>
  <link href="../shared/nexus-topnav-v2.css?v=54" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="../runtime-guard.js"></script>
  <style>
    :root {
      --bg-void: #020306;
      --bg-panel: rgba(6, 10, 24, 0.6);
      --border-cyan: rgba(0, 242, 254, 0.08);
      --border-cyan-bright: rgba(0, 242, 254, 0.35);
      
      --glow-cyan: #00f2fe;
      --glow-violet: #8b5cf6;
      --glow-magenta: #ec4899;
      --glow-green: #10b981;
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      
      --font-display: "Space Grotesk", sans-serif;
      --font-body: "Plus Jakarta Sans", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-body);
      overflow: hidden; /* Lock page viewport scroll */
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Holographic Lights */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background: 
        radial-gradient(900px circle at 5% 5%, rgba(0, 242, 254, 0.12), transparent 60%),
        radial-gradient(1100px circle at 95% 95%, rgba(139, 92, 246, 0.08), transparent 60%);
      pointer-events: none;
    }

    .telemetry-grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-size: 80px 80px;
      background-image: 
        linear-gradient(to right, rgba(0, 242, 254, 0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 242, 254, 0.015) 1px, transparent 1px);
      mask-image: radial-gradient(circle at 50% 40%, black 10%, transparent 95%);
      -webkit-mask-image: radial-gradient(circle at 50% 40%, black 10%, transparent 95%);
      pointer-events: none;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.01);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 242, 254, 0.12);
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--glow-cyan);
    }

    /* Page container */
    .console-frame {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 68px);
      margin-top: 68px;
      overflow: hidden;
    }

    /* Header Panel */
    .console-header-bar {
      height: 76px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(2, 3, 7, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      flex-shrink: 0;
      z-index: 100;
    }

    .header-left-side {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--glow-cyan);
      box-shadow: 0 0 10px var(--glow-cyan);
      animation: pulse 1.8s infinite;
    }

    .console-brand-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
      background: linear-gradient(135deg, #ffffff, var(--glow-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .console-brand-subtitle {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-left: 12px;
      padding-left: 12px;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
    }

    .console-stats-bar {
      display: flex;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .stat-badge-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: 6px;
      color: var(--text-secondary);
    }
    .stat-badge-item span {
      color: var(--text-primary);
      font-weight: 600;
      margin-left: 4px;
    }

    /* Workspace split layout */
    .workspace-split {
      flex: 1;
      display: flex;
      overflow: hidden;
      height: calc(100% - 76px);
      min-height: 0;
    }

    /* Left pane: Directory Deck */
    .directory-column {
      width: 35%;
      max-width: 440px;
      min-width: 340px;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      background: rgba(2, 3, 6, 0.55);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    /* Filter section */
    .filter-section {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }
    .search-field-wrap {
      position: relative;
    }
    .search-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: var(--font-mono);
      outline: none;
      transition: all 0.2s;
    }
    .search-field:focus {
      border-color: var(--glow-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.12);
      background: rgba(0, 242, 254, 0.01);
    }

    .toggles-row {
      display: flex;
      gap: 4px;
    }
    .toggle-pill {
      flex: 1;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .toggle-pill:hover, .toggle-pill.active {
      border-color: var(--glow-cyan);
      color: var(--text-primary);
      background: rgba(0, 242, 254, 0.03);
    }

    /* Scroll List */
    .cards-deck-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Node Card with wrap-safe title */
    .node-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-cyan);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      --mouse-x: 0px;
      --mouse-y: 0px;
      flex-shrink: 0;
    }
    .node-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(100px circle at var(--mouse-x) var(--mouse-y), rgba(0, 242, 254, 0.14), transparent 80%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .node-card:hover::before {
      opacity: 1;
    }
    .node-card:hover {
      border-color: rgba(0, 242, 254, 0.2);
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.02);
      transform: translateY(-1px);
    }
    .node-card.active {
      border-color: var(--glow-cyan);
      background: rgba(0, 242, 254, 0.02);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.06);
    }
    .node-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .node-card-name {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
      white-space: normal;
      word-break: break-word;
      line-height: 1.3;
    }
    .node-led {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-secondary);
      flex-shrink: 0;
      margin-top: 4px;
    }
    .node-card.active .node-led {
      background: var(--glow-cyan);
      box-shadow: 0 0 6px var(--glow-cyan);
    }
    .node-card[data-category="case"] .node-led {
      background: var(--glow-magenta);
      box-shadow: 0 0 6px var(--glow-magenta);
    }
    .node-card[data-category="help"] .node-led {
      background: var(--glow-green);
      box-shadow: 0 0 6px var(--glow-green);
    }

    /* Right Column: Reader Workspace */
    .workspace-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(2, 3, 6, 0.2);
      height: 100%;
      min-height: 0;
    }

    .meta-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding: 24px 32px 16px;
      flex-shrink: 0;
      background: rgba(2, 3, 7, 0.2);
    }
    .meta-node-status {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--glow-violet);
      text-transform: uppercase;
      font-weight: 600;
    }
    .meta-node-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      margin: 4px 0 0 0;
      letter-spacing: -0.01em;
    }
    .launch-instance-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--glow-cyan), #0284c7);
      border: none;
      border-radius: 8px;
      color: var(--bg-void);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 12px;
      padding: 10px 18px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.15);
      transition: all 0.2s;
    }
    .launch-instance-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.35);
    }

    /* Markdown Reader Body styling */
    .reader-body-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
    }

    /* Screen flicker transition */
    .terminal-flicker {
      animation: tabFlicker 0.22s steps(2);
    }
    @keyframes tabFlicker {
      0% { opacity: 0.4; }
      50% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    /* Beautiful markdown compiled HTML elements */
    .markdown-compiled {
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.88);
      max-width: 780px;
    }
    .markdown-compiled .md-h1 {
      font-family: var(--font-display);
      font-size: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
      margin-top: 0;
      margin-bottom: 20px;
      color: var(--text-primary);
    }
    .markdown-compiled .md-h2 {
      font-family: var(--font-display);
      font-size: 22px;
      margin-top: 32px;
      margin-bottom: 16px;
      color: var(--text-primary);
    }
    .markdown-compiled .md-h3 {
      font-family: var(--font-display);
      font-size: 18px;
      margin-top: 24px;
      margin-bottom: 12px;
      color: var(--text-primary);
    }
    .markdown-compiled .md-p {
      margin-top: 0;
      margin-bottom: 16px;
      color: var(--text-secondary);
    }
    .markdown-compiled .md-ul {
      margin-top: 0;
      margin-bottom: 20px;
      padding-left: 20px;
    }
    .markdown-compiled .md-ul li {
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    .markdown-compiled .md-code {
      background: #010204;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--glow-cyan);
      margin-top: 16px;
      margin-bottom: 20px;
    }
    .markdown-compiled .md-inline-code {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--glow-cyan);
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="telemetry-grid"></div>

  <div class="console-frame">
    <!-- Unified 100% Width Header Bar -->
    <header class="console-header-bar">
      <div class="header-left-side">
        <div class="status-led"></div>
        <h1 class="console-brand-title">Nexus Utilities</h1>
        <span class="console-brand-subtitle">Manuals & Reference Explorer</span>
      </div>
      
      <div class="console-stats-bar">
        <div class="stat-badge-item">Case Reports: <span id="lbl-cases" style="color: var(--glow-magenta);">0</span></div>
        <div class="stat-badge-item">Help Docs: <span id="lbl-help" style="color: var(--glow-green);">0</span></div>
        <div class="stat-badge-item">Readmes: <span id="lbl-readmes" style="color: var(--glow-cyan);">0</span></div>
      </div>
    </header>

    <!-- Split Pane Workspace -->
    <div class="workspace-split">
      <!-- Left Column: Scrollable cards directory -->
      <aside class="directory-column">
        <div class="filter-section">
          <div class="search-field-wrap">
            <input class="search-field" id="search-box" placeholder="Search manuals database..." type="text"/>
          </div>
          <div class="toggles-row">
            <button class="toggle-pill active" data-cat="case">Case Reports</button>
            <button class="toggle-pill" data-cat="help">Help Docs</button>
            <button class="toggle-pill" data-cat="readme">Readmes</button>
          </div>
        </div>

        <div class="cards-deck-scroll" id="node-deck">
          <!-- Rendered dynamically -->
        </div>
      </aside>

      <!-- Right Column: Interactive document reader viewport -->
      <main class="workspace-column">
        <div class="meta-top-bar" id="reader-header-area" style="display: none;">
          <div>
            <span class="meta-node-status" id="doc-category-badge">HELP MANUAL</span>
            <h2 class="meta-node-title" id="doc-title-header">Select document</h2>
          </div>
          <a class="launch-instance-btn" id="doc-launch-btn" href="#" target="_blank" rel="noopener">
            Open Standalone page
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 01-2-2h6M15 3h6v6M10 14L21 3"/></svg>
          </a>
        </div>

        <div class="reader-body-scroll" id="reader-viewport">
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; height: 100%; color:var(--text-secondary);">
            <svg style="width:40px; height:40px; stroke:rgba(0, 242, 254, 0.35); fill:none; margin-bottom:12px;" viewBox="0 0 24 24">
              <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span style="font-family: var(--font-mono); font-size:10px; letter-spacing: 0.1em; text-transform:uppercase;">Select system manual to execute loader</span>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../shared/nexus-topnav-v2.js?v=54"></script>
  <script>
    (async () => {
      // 1. Fetch document registry
      let docsList = [];
      try {
        const res = await fetch("../assets/docs-list.json");
        if (res.ok) docsList = await res.json();
      } catch (e) {
        console.error("Documentation loader error", e);
      }

      // Update counters
      document.getElementById("lbl-cases").textContent = docsList.filter(d => d.category === "case").length;
      document.getElementById("lbl-help").textContent = docsList.filter(d => d.category === "help").length;
      document.getElementById("lbl-readmes").textContent = docsList.filter(d => d.category === "readme").length;

      let selectedDoc = null;
      let activeCategory = "case";
      let query = "";

      const deck = document.getElementById("node-deck");
      const searchBox = document.getElementById("search-box");
      const filterToggles = document.querySelectorAll(".toggle-pill");
      const viewport = document.getElementById("reader-viewport");
      const headerArea = document.getElementById("reader-header-area");

      const trackCursorGlow = (e) => {
        const card = e.currentTarget;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        card.style.setProperty("--mouse-x", `${x}px`);
        card.style.setProperty("--mouse-y", `${y}px`);
      };

      const renderDeck = () => {
        deck.innerHTML = "";
        const filtered = docsList.filter(doc => {
          const mC = doc.category === activeCategory;
          const mQ = doc.name.toLowerCase().includes(query);
          return mC && mQ;
        });

        filtered.forEach(doc => {
          const card = document.createElement("div");
          card.className = `node-card ${selectedDoc && selectedDoc.name === doc.name ? "active" : ""}`;
          card.setAttribute("data-category", doc.category);
          card.innerHTML = `
            <div class="node-card-head">
              <h3 class="node-card-name">${doc.name}</h3>
              <div class="node-led"></div>
            </div>
          `;
          card.addEventListener("mousemove", trackCursorGlow);
          card.addEventListener("click", () => selectDoc(doc));
          deck.appendChild(card);
        });

        if (!filtered.length) {
          deck.innerHTML = `<div style="text-align:center; padding:32px; color:var(--text-secondary); font-size:11px; font-family:var(--font-mono);">NO DOCUMENT IN REGISTER</div>`;
        }
      };

      const selectDoc = (doc) => {
        selectedDoc = doc;
        document.querySelectorAll(".node-card").forEach(c => c.classList.remove("active"));
        renderDeck();

        // Viewport transitions
        viewport.classList.remove("terminal-flicker");
        void viewport.offsetWidth;
        viewport.classList.add("terminal-flicker");

        loadDocContent(doc);
      };

      const loadDocContent = async (doc) => {
        // Map url
        let parts = doc.href.split("/");
        let id = parts[parts.length - 2];
        let mdUrl = "";
        
        if (doc.category === "help") {
          mdUrl = `../data/help/${id}.md`;
        } else if (doc.category === "readme") {
          mdUrl = `../data/readme/${id}.md`;
        } else if (doc.category === "case") {
          mdUrl = `../docs/case-reports/${id}.canonical.md`;
        }

        // Show header
        headerArea.style.display = "flex";
        document.getElementById("doc-title-header").textContent = doc.name;
        document.getElementById("doc-category-badge").textContent = 
          doc.category === "help" ? "HELP MANUAL" : doc.category === "readme" ? "PROJECT README" : "CASE STUDY ANALYSIS";
        document.getElementById("doc-launch-btn").href = doc.href;

        viewport.innerHTML = `<div style="font-family:var(--font-mono); font-size:12px; color:var(--glow-cyan);">Loading data source at ${mdUrl}...</div>`;

        try {
          const res = await fetch(mdUrl);
          if (res.ok) {
            const raw = await res.text();
            viewport.innerHTML = `<div class="markdown-compiled">${compileMarkdown(raw)}</div>`;
          } else {
            viewport.innerHTML = `
              <div style="text-align:center; padding:48px; color:var(--text-secondary);">
                <p style="font-size:14px; margin:0 0 16px 0;">Markdown source file for "${doc.name}" could not be fetched.</p>
                <a class="launch-instance-btn" href="${doc.href}" target="_blank">Open Standalone Page</a>
              </div>
            `;
          }
        } catch (e) {
          console.error("AJAX doc loader failure", e);
          viewport.innerHTML = `<div style="color:var(--glow-magenta); font-family:var(--font-mono);">ERROR LOADING DOCUMENT STREAM</div>`;
        }
      };

      // Clean, robust client-side Markdown compile engine
      const compileMarkdown = (md) => {
        let html = md
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

        // Headers
        html = html.replace(/^# (.*$)/gim, '<h1 class="md-h1">$1</h1>');
        html = html.replace(/^## (.*$)/gim, '<h2 class="md-h2">$1</h2>');
        html = html.replace(/^### (.*$)/gim, '<h3 class="md-h3">$1</h3>');
        html = html.replace(/^#### (.*$)/gim, '<h4 class="md-h4">$1</h4>');

        // Fenced code blocks
        html = html.replace(/```([\s\S]*?)```/gm, (match, code) => {
          return `<pre class="md-code"><code>${code.trim()}</code></pre>`;
        });

        // Inline code blocks
        html = html.replace(/`([^`]+)`/g, '<code class="md-inline-code">$1</code>');

        // Formatting
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');
        html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        html = html.replace(/_([^_]+)_/g, '<em>$1</em>');

        // Lists
        const lines = html.split('\n');
        let inList = false;
        for (let i = 0; i < lines.length; i++) {
          const isItem = lines[i].trim().startsWith('- ') || lines[i].trim().startsWith('* ');
          if (isItem) {
            const content = lines[i].trim().substring(2);
            if (!inList) {
              lines[i] = '<ul class="md-ul"><li>' + content + '</li>';
              inList = true;
            } else {
              lines[i] = '<li>' + content + '</li>';
            }
          } else {
            if (inList) {
              lines[i] = '</ul>' + lines[i];
              inList = false;
            }
          }
        }
        if (inList) lines.push('</ul>');
        html = lines.join('\n');

        // Paragraphs
        html = html.split(/\n\s*\n/).map(p => {
          const clean = p.trim();
          if (clean.startsWith('<h') || clean.startsWith('<ul') || clean.startsWith('<li>') || clean.startsWith('<pre')) {
            return clean;
          }
          return `<p class="md-p">${clean}</p>`;
        }).join('\n');

        return html;
      };

      // Search & Filters
      searchBox.addEventListener("input", (e) => {
        query = e.target.value.toLowerCase();
        renderDeck();
      });

      filterToggles.forEach(btn => {
        btn.addEventListener("click", () => {
          filterToggles.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          activeCategory = btn.getAttribute("data-cat");
          renderDeck();
        });
      });

      // Init Load
      renderDeck();
      if (docsList.length > 0) {
        // Load first case report by default
        const initial = docsList.find(d => d.category === "case");
        if (initial) selectDoc(initial);
      }
    })();
  </script>
</body>
</html>
